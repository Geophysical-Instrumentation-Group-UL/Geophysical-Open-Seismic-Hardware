; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; Note : Teensy boards do not support a upload_port specification. To allow upload_port specification, 
; install the tycmd command-line here: https://github.com/Koromix/tytools.

[env]
src_filter = +<*> -<.git/> -<.svn/> -<example/> -<examples/>
lib_deps = Vector

[env:teensy40master]
platform = teensy
board = teensy40
framework = arduino
monitor_speed = 115200
src_filter = ${env.src_filter} -<mainWorker.cpp>

[env:teensy40worker1]
platform = teensy
board = teensy40
framework = arduino
build_flags = 
    -D workerID=1   
; automatically assigns worker ID without having to modify mainWorker.cpp for each worker upload
board_build.f_cpu = 655000000L
monitor_speed = 115200
src_filter = ${env.src_filter} -<mainLeader.cpp>

[env:teensy40worker2]
platform = teensy
board = teensy40
framework = arduino
build_flags = 
    -D workerID=2
board_build.f_cpu = 655000000L
monitor_speed = 115200
src_filter = ${env.src_filter} -<mainLeader.cpp>
board_ID = 2

